name: Build ImDisk Driver

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup Windows Driver Kit (WDK)
        uses: WindowsDriverKit/setup-wdk@v1
        with:
          wdk-version: '10.0.22621.2428'

      - name: Patch Legacy Macros in Project Files
        shell: pwsh
        run: |
          Get-ChildItem -Recurse -Filter *.vcxproj | ForEach-Object {
            $c = Get-Content $_.FullName -Raw
            $c = $c -replace 'vsnprintf=_vsnprintf;?', ''
            $c = $c -replace 'snwprintf=_snwprintf;?', ''
            $c = $c -replace '<TreatWarningAsError>true</TreatWarningAsError>', '<TreatWarningAsError>false</TreatWarningAsError>'
            Set-Content $_.FullName $c
          }

      - name: Build Kernel Driver (x64)
        shell: pwsh
        run: |
          [xml]$proj = Get-Content sys\sys.vcxproj
          $configs = @($proj.Project.ItemGroup | Where-Object { $_.Label -eq 'ProjectConfigurations' } | ForEach-Object { $_.ProjectConfiguration } | Where-Object { $_.Platform -eq 'x64' -and $_.Configuration -like '*Release*' })
          $cfg = $configs[0].Configuration
          Write-Host "Building Configuration: $cfg"
          msbuild sys\sys.vcxproj /p:Configuration="$cfg" /p:Platform=x64 /p:PlatformToolset=WindowsKernelModeDriver10.0 /p:TargetVersion=Windows10 /p:WindowsTargetPlatformVersion=10.0.22621.0

      - name: Build CLI, CPL, and Service (x64)
        continue-on-error: true
        run: |
          msbuild cli\cli.vcxproj /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v143 /p:WindowsTargetPlatformVersion=10.0.22621.0
          msbuild svc\imdsksvc.vcxproj /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v143 /p:WindowsTargetPlatformVersion=10.0.22621.0

      - name: Upload Compiled Files
        uses: actions/upload-artifact@v4
        with:
          name: ImDisk-x64-Compiled
          path: |
            **/x64/**/*.sys
            **/Release/**/*.sys
            **/Release/**/*.exe
            **/Release/**/*.cpl
            **/Release/**/*.dll
            imdisk.inf
