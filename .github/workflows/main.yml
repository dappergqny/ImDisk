name: Build ImDisk Driver

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build ImDisk x64
        run: |
          msbuild ImDisk.sln /p:Configuration=Release /p:Platform=x64 /p:WindowsTargetPlatformVersion=10.0 /p:TargetVersion=Windows10 /m

      - name: Upload Compiled Files
        uses: actions/upload-artifact@v4
        with:
          name: ImDisk-x64-Compiled
          path: |
            **/x64/Release/*.sys
            **/x64/Release/*.exe
            **/x64/Release/*.cpl
            **/x64/Release/*.dll
            imdisk.inf
