name: Build ImDisk Driver

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup MSVC x64 Environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Windows Driver Kit (WDK)
        shell: pwsh
        run: |
          winget install --id Microsoft.WindowsWDK.10.0.26100 -e --silent --accept-package-agreements --accept-source-agreements

      - name: Direct Compile imdisk.sys (x64)
        shell: cmd
        run: |
          mkdir out_x64
          rc.exe /I "C:\Program Files (x86)\Windows Kits\10\Include\10.0.26100.0\km" /I "C:\Program Files (x86)\Windows Kits\10\Include\10.0.26100.0\shared" /I "inc" /fo out_x64\imdisk.res sys\imdisk.rc
          cl.exe /nologo /c /O2 /Oi /Ot /GS- /W3 /Gz /kernel /D _AMD64_ /D AMD64 /D _WIN64 /D NDEBUG /D POOL_NX_OPTIN=1 /I "C:\Program Files (x86)\Windows Kits\10\Include\10.0.26100.0\km" /I "C:\Program Files (x86)\Windows Kits\10\Include\10.0.26100.0\km\crt" /I "C:\Program Files (x86)\Windows Kits\10\Include\10.0.26100.0\shared" /I "inc" /Fo"out_x64\\" sys\*.cpp
          link.exe /nologo /DRIVER /SUBSYSTEM:NATIVE /ENTRY:DriverEntry /NODEFAULTLIB /MERGE:.rdata=.text /OPT:REF /OPT:ICF /OUT:out_x64\imdisk.sys /LIBPATH:"C:\Program Files (x86)\Windows Kits\10\Lib\10.0.26100.0\km\x64" out_x64\*.obj out_x64\imdisk.res ntoskrnl.lib hal.lib wdmsec.lib libcntpr.lib BufferOverflowK.lib

      - name: Upload Compiled Driver
        uses: actions/upload-artifact@v4
        with:
          name: ImDisk-x64-Compiled
          path: |
            out_x64/imdisk.sys
            imdisk.inf
